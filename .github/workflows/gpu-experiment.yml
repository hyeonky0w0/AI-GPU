name: GPU Experiment

on:
  push:
    branches:
      - "feature/**"
      - "experiment/**"
  workflow_dispatch:

concurrency:
  group: gpu-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-gpu-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 130

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package current branch
        env:
          EXPERIMENT_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: python scripts/package_job.py

      - name: Submit and wait for RunPod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          POLL_TIMEOUT_SECONDS: "7200"
        run: python scripts/runpod_job.py

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-experiment-${{ github.ref_name }}-${{ github.sha }}
          path: |
            results/
            runpod-response.json
          if-no-files-found: warn
          retention-days: 30
