name: LG Aimers GPU Experiment

on:
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "real_mlp_oof는 실제 890 MLP rolling OOF와 고정 Router 비교를 RunPod에서 실행"
        required: true
        default: "gate_smoke"
        type: choice
        options: ["gate_smoke", "verify_volume", "gate_rolling", "gpu_mlp_smoke", "real_mlp_oof", "bounded_crossfit_residual_mlp"]
      phase:
        description: "040 전용 단계(다른 execution_mode에서는 무시)"
        required: true
        default: "seed42"
        type: choice
        options: ["seed42", "three_seed", "final_train"]

concurrency:
  group: lg-aimers-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-gpu-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 1200
    permissions:
      contents: read
    env:
      LG_AIMERS_EXECUTION_MODE: ${{ inputs.execution_mode || 'gate_smoke' }}
      LG_AIMERS_EXPERIMENT_PHASE: ${{ inputs.phase || 'seed42' }}
    steps:
      - uses: actions/checkout@v4

      - name: Package current LG Aimers commit
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: python runpod/lg_aimers/scripts/package_job.py

      - name: Submit and wait for RunPod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          POLL_TIMEOUT_SECONDS: "71400"
        run: python runpod/lg_aimers/scripts/runpod_job.py

      - name: Make artifact name filesystem-safe
        if: always()
        shell: bash
        run: |
          echo "SAFE_REF_NAME=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
          if [[ "$LG_AIMERS_EXECUTION_MODE" == "bounded_crossfit_residual_mlp" ]]; then
            echo "SAFE_ARTIFACT_MODE=${LG_AIMERS_EXECUTION_MODE}-${LG_AIMERS_EXPERIMENT_PHASE}" >> "$GITHUB_ENV"
          else
            echo "SAFE_ARTIFACT_MODE=${LG_AIMERS_EXECUTION_MODE}" >> "$GITHUB_ENV"
          fi

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lg-aimers-${{ env.SAFE_ARTIFACT_MODE }}-${{ env.SAFE_REF_NAME }}-${{ github.sha }}
          path: |
            results/
            runpod-response.json
          if-no-files-found: warn
          retention-days: 30
