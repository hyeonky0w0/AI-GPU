name: LG Aimers GPU Experiment

on:
  push:
    branches:
      - "gpu/**"
      - "feature/**"
      - "experiment/**"
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "gate_smoke은 안전 기본값, verify_volume은 데이터 연결만 검사, gate_rolling은 승인된 OOF gate 실행"
        required: true
        default: "gate_smoke"
        type: choice
        options: ["gate_smoke", "verify_volume", "gate_rolling"]

concurrency:
  group: lg-aimers-gpu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-gpu-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      contents: read
    env:
      LG_AIMERS_EXECUTION_MODE: ${{ inputs.execution_mode || 'gate_smoke' }}
    steps:
      - uses: actions/checkout@v4

      - name: Package current LG Aimers commit
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_SHA: ${{ github.sha }}
        run: python runpod/lg_aimers/scripts/package_job.py

      - name: Submit and wait for RunPod
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_ENDPOINT_ID: ${{ secrets.RUNPOD_ENDPOINT_ID }}
          POLL_TIMEOUT_SECONDS: "7200"
        run: python runpod/lg_aimers/scripts/runpod_job.py

      - name: Upload small experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lg-aimers-${{ env.LG_AIMERS_EXECUTION_MODE }}-${{ github.ref_name }}-${{ github.sha }}
          path: |
            results/
            runpod-response.json
          if-no-files-found: warn
          retention-days: 30
